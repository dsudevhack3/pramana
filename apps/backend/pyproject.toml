[project]
name = "prescription-provenance-backend"
version = "2.0.0"
description = "Backend for the Prescription Provenance Platform — v2 (adds pharmacy onboarding + admin moderation)"
requires-python = ">=3.12"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
disallow_untyped_defs = true
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests", "src"]